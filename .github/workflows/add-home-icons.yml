name: Add home screen icons

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-home-icons.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-home-icons
  cancel-in-progress: false

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Create icon files
        shell: python
        run: |
          import base64
          from pathlib import Path
          
          files = {
              'apple-touch-icon.png': '',
              'icon-192.png': '',
              'icon-512.png': '',
              'manifest.webmanifest': '',
          }
          for name, encoded in files.items():
              data = base64.b64decode(encoded, validate=True)
              if name.endswith('.png'):
                  assert data.startswith(bytes([137,80,78,71,13,10,26,10]))
              Path(name).write_bytes(data)
              print('Created', name)
      - name: Save icon files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png manifest.webmanifest
          if git diff --cached --quiet; then
            echo "Icons are already up to date."
          else
            git commit -m "Add home screen icons"
            git push origin HEAD:main
          fi
