  <style>
/* 岩序 · Nothing 风。黑白灰为主，红色只表示「当前 / 完成 / 终点」；大数字用点阵。 */
:root{
 color-scheme:light dark;
 --bg:#f2f2ef;--card:#fbfbf9;--surface:#e8e8e4;--surface-2:#f6f6f3;--ink:#111;--muted:#6e6e6a;--line:#deded9;--line-strong:#c4c4be;--dot-off:#d2d2cc;
 --brand:#111;--brand-ink:#fff;--red:#d71921;--danger:#d71921;--danger-soft:#f6e2e0;--soft:#e8e8e4;
 --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-synthesis:none
}
@media(prefers-color-scheme:dark){:root{
 --bg:#000;--card:#0e0e0e;--surface:#1b1b1b;--surface-2:#131313;--ink:#f5f5f2;--muted:#8e8e89;--line:#222;--line-strong:#3a3a3a;--dot-off:#2b2b2b;
 --brand:#f5f5f2;--brand-ink:#000;--red:#ff2b30;--danger:#ff4a4f;--danger-soft:#2a1213;--soft:#1b1b1b
}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg)}
button,input,textarea,select{font:inherit}button,a,input,summary{touch-action:manipulation}
button{cursor:pointer;border:0;color:inherit;background:none;min-height:44px;padding:10px 15px;border-radius:999px;transition:background-color .15s,transform .12s,color .15s}
button:active{transform:scale(.96)}button:disabled{opacity:.35;cursor:default;transform:none}
a{color:inherit;text-underline-offset:4px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3,p{margin:0}h1,h2,h3{text-wrap:balance}p,li{text-wrap:pretty}
h1{font-size:30px;font-weight:700;letter-spacing:-.6px;line-height:1.25}h2{font-size:19px;font-weight:650;line-height:1.4}h3{font-size:16px;font-weight:600}
small,.muted{color:var(--muted);font-size:12px;line-height:1.6}small{display:block}
[hidden]{display:none!important}
/* 等宽小标签：英文、编号、单位 */
.route-top,.week-heading>span{font-family:var(--mono);letter-spacing:.04em}

/* 点阵数字 */
.dm{display:inline-flex;vertical-align:-.08em;line-height:1}.dm svg{display:block;overflow:visible}
.dm.red{color:var(--red)}
/* 点阵分隔线 */
.dot-rule{height:6px;margin:18px 0;background:radial-gradient(circle,var(--line-strong) 1.3px,transparent 1.6px) 0 50%/10px 6px repeat-x}

#app{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 18px 130px}
body:has(#timer:not([hidden])) #app{padding-bottom:210px}

/* 日期栏 */
.datebar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:14px;margin-bottom:20px;border-bottom:1px dashed var(--line-strong)}
.date-pick{position:relative;display:flex;align-items:baseline;gap:8px;font-family:var(--mono);cursor:pointer}
.date-pick b{font-size:26px;font-weight:600;letter-spacing:.02em}.date-pick small{display:inline;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em}
.date-pick em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--red)}
.date-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;font-size:16px}
.date-input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.date-actions{display:flex;align-items:center;gap:2px}.date-actions button{width:38px;height:40px;min-height:0;padding:0;font-size:18px;line-height:1}
.date-code{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;border:1px solid var(--line-strong);border-radius:999px;padding:3px 9px;white-space:nowrap}

/* 提示条 */
.notice{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:8px 14px;margin-bottom:16px;font-size:13px;line-height:1.6;border-radius:14px;border:1px dashed var(--line-strong)}
.notice.warning{border-color:var(--red);color:var(--red)}.notice a{padding:6px 0;font-weight:600}
.text-button{font-size:13px;font-weight:600;padding:6px 4px;min-height:40px;text-decoration:underline;text-underline-offset:4px}

/* 标题区 */
.hero{position:relative;margin-bottom:20px}
.eyebrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:10px}
.phase{font-size:10px;color:var(--red);border:1px solid var(--red);padding:1px 7px;border-radius:999px}
.hero .description{font-size:14px;line-height:1.8;color:var(--muted);margin:10px 0}
.hero-title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.hero-count{display:flex;align-items:flex-end;gap:4px;font-size:40px;line-height:1;white-space:nowrap}
.hero-count small{display:inline;font-family:var(--mono);font-size:14px;margin-bottom:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.meta span{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:3px 10px;border-radius:999px}

/* 进度：一排点阵格，每个动作一格，完成变白/黑，全部完成后 TOP 变红 */
.progress-block{margin:20px 0 0}
.route{display:flex;align-items:center;gap:6px}
.route-hold{flex:1;height:14px;border-radius:999px;background:radial-gradient(circle,var(--dot-off) 2.2px,transparent 2.6px) 0 50%/9px 14px repeat-x;transition:background .25s}
.route-hold.done{background:radial-gradient(circle,var(--ink) 2.8px,transparent 3.2px) 0 50%/9px 14px repeat-x}
.route-hold.paused{opacity:.4}
.route-link{display:none}
.route-top{flex-shrink:0;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;color:var(--muted);border:1px solid var(--line-strong)}
.route-top.done{color:#fff;background:var(--red);border-color:var(--red);animation:pop .45s ease}
.progress-caption{display:block;font-size:12px;color:var(--muted);margin-top:10px}
.progress-caption.done{color:var(--red);font-weight:600}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

/* 热身 */
.warmup{background:var(--card);border-radius:20px;padding:0 16px;margin-bottom:22px;box-shadow:0 0 0 1px var(--line)}
.warmup>summary{min-height:64px;display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none}
.warmup summary::-webkit-details-marker{display:none}
.warm-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--surface);font-size:18px}
.warm-summary{flex:1}.warm-summary strong{display:block;font-size:15px;font-weight:600}.warm-summary small{font-size:12px}
.warm-count{font-family:var(--mono);font-size:13px;color:var(--muted)}
.chevron{font-size:16px;color:var(--muted);min-width:16px;text-align:center;transition:transform .2s}
.warmup[open]>summary .chevron{transform:rotate(180deg)}
.warm-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.warm-row input{width:22px;height:22px;margin:3px 0 0;flex-shrink:0;accent-color:var(--red)}
.warm-content{flex:1;min-width:0}.warm-content>label{display:block;min-height:44px;font-size:14px;line-height:1.6;cursor:pointer}
.warm-title{font-weight:500;overflow-wrap:anywhere}.warm-dose{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.warm-tip>summary{font-size:12px;min-height:36px;display:flex;align-items:center;color:var(--muted);cursor:pointer;list-style:none}
.warm-tip>summary:before{content:'›';display:inline-block;margin-right:6px;transition:transform .2s}.warm-tip[open]>summary:before{transform:rotate(90deg)}
.warm-tip p{font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 4px}

/* 主训练标题 */
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px;gap:10px}
.section-title h2{font-size:15px}.section-title small{font-size:12px}

/* 动作卡片：无彩色，编号圆圈表示状态 */
.exercise-list{display:flex;flex-direction:column;gap:8px}
.exercise{position:relative;background:var(--card);border-radius:20px;box-shadow:0 0 0 1px var(--line);overflow:hidden;scroll-margin-top:72px;transition:box-shadow .2s}
.exercise.is-open{box-shadow:0 0 0 1.5px var(--ink)}
.exercise.completed:not(.is-open){background:transparent}
.ex-heading{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:74px;text-align:left;border-radius:0}
.ex-heading:active{transform:none}
.order{flex-shrink:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-strong)}
.is-open .order{background:var(--ink);color:var(--bg);box-shadow:none}
.completed .order{background:var(--red);color:#fff;box-shadow:none;font-size:14px}
.ex-title{flex:1;min-width:0}
.exercise-name{display:block;font-size:15px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.completed:not(.is-open) .exercise-name{color:var(--muted)}
.ex-title small{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:2px}
.tag{font-size:11px;color:var(--ink);border:1px solid var(--line-strong);border-radius:999px;padding:0 6px;line-height:1.6}
.status{font-size:12px;white-space:nowrap;color:var(--muted)}
.status.done,.status.more{color:var(--red);font-weight:600}.status.less{color:var(--ink);font-weight:600}
.exercise-body{padding:0 18px 12px}
.dose-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 8px}
.dose{display:flex;align-items:flex-end;gap:2px;font-size:44px;line-height:1;white-space:nowrap}
.dose>span:not(.dm){font-size:13px;color:var(--muted);margin:0 0 3px 4px}
.dose em{font-size:20px;font-style:normal;color:var(--muted);margin:0 8px 6px}
.rest-chip{font-size:12px;color:var(--muted);white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.cue{font-size:14px;line-height:1.7;color:var(--muted);margin:6px 0 16px}
.adjustment{font-size:13px;line-height:1.7;padding:9px 12px;border-radius:12px;border:1px dashed var(--line-strong);margin:8px 0}
.increase{font-family:var(--mono);font-size:11px;color:var(--red);margin:6px 0}

/* 每组：圆形按键，完成后变红 */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:10px;margin:0 0 16px}
.set-btn{aspect-ratio:1;max-width:64px;width:100%;justify-self:center;min-height:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border-radius:50%;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.set-btn>span{font-family:var(--mono);font-size:17px;font-weight:600;line-height:1.2}
.set-btn small{font-family:var(--mono);font-size:9px;line-height:1.2}
.set-btn.checked{background:var(--red);color:#fff;box-shadow:none}
.set-btn.checked small{color:#ffffffcc}
.set-btn.checked>span{animation:pop .3s ease}

/* 操作 */
.card-actions{display:flex;flex-direction:column;gap:8px;margin:0 0 6px}
.card-actions .complete{width:100%;min-height:52px;font-size:15px;font-weight:600;color:var(--brand-ink);background:var(--brand)}
.adjust-row{display:flex;gap:8px}
.adjust-row button{flex:1;min-width:0;min-height:42px;padding:8px 6px;font-size:13px;box-shadow:inset 0 0 0 1px var(--line-strong)}
.adjust-row .stop{color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger);font-weight:600}
.actual-record{font-size:13px;line-height:1.7;border:1px dashed var(--line-strong);border-radius:14px;margin:0 0 12px;padding:2px 12px}
.actual-record>summary{display:flex;justify-content:space-between;align-items:center;gap:12px;list-style:none;cursor:pointer;min-height:40px;font-weight:600}
.actual-record summary span{font-size:12px;color:var(--muted);font-weight:400}
.actual-record p{padding:0 0 8px;color:var(--muted);overflow-wrap:anywhere}
.instructions{margin-top:6px;border-top:1px solid var(--line)}
.instructions>summary{display:flex;align-items:center;gap:8px;min-height:46px;font-size:14px;font-weight:600;cursor:pointer;list-style:none}
.instructions>summary span{font-size:12px;color:var(--muted);font-weight:400;margin-left:auto}
.instructions>summary:after{content:'⌄';color:var(--muted);transition:transform .2s}.instructions[open]>summary:after{transform:rotate(180deg)}
.instructions .setup{background:var(--surface);padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.7;color:var(--muted)}
.instructions ol{font-size:14px;line-height:1.8;padding-left:20px;margin:10px 0}
.instructions li{margin-bottom:6px}
.video-link{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600}
.inline-note{font-size:12px;color:var(--muted);line-height:1.7}
.exercise-footer{display:flex;justify-content:flex-end;border-top:1px solid var(--line);margin-top:6px}
.next-action{font-size:14px;font-weight:600;color:var(--red);padding:8px 4px;min-height:46px}

/* 动作示意 */
.demo-stage{height:190px;background:var(--surface);border-radius:14px;margin:10px 0;position:relative;overflow:hidden}
.demo-stage svg{width:100%;height:155px;color:var(--ink)}
.demo-control{position:absolute;bottom:6px;right:10px;display:flex}
.demo-control span{font-size:11px;color:var(--muted)}
.demo-control button{font-size:12px;padding:6px 12px;min-height:44px;background:var(--card)}

/* 训练感受 & 说明 */
.session-note{margin-top:18px;padding:0 16px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.session-note>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;list-style:none;cursor:pointer}
.session-note summary strong{font-size:15px;font-weight:600}.session-note summary span{font-size:12px;color:var(--muted)}
.session-note[open]{padding-bottom:16px}
.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:block;color:var(--muted);font-size:13px;margin:12px 0 4px}
.field input,.field textarea,textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line-strong);border-radius:14px;padding:11px 12px;color:var(--ink);background:transparent;font-size:16px}
.field input{font-family:var(--mono)}
.training-notes{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.8}
.training-notes summary{display:flex;align-items:center;gap:6px;min-height:44px;cursor:pointer;list-style:none}
.training-notes summary:after{content:'⌄'}
.training-notes p{margin:0 0 10px}

/* 开练前 / 休息日 / 周期结束 */
.welcome-date{display:flex;align-items:flex-end;gap:10px;font-size:64px;line-height:1;margin:22px 0 10px}
.welcome-date>span:not(.dm){font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px}
.countdown{font-family:var(--mono);font-size:12px;color:var(--red);text-transform:uppercase}
.prestart-card{position:relative;margin-top:24px;padding:20px;background:var(--card);border-radius:22px;box-shadow:0 0 0 1px var(--line)}
.prestart-card>small{font-family:var(--mono);font-size:11px;margin-bottom:6px}
.prestart-card h2{font-size:21px}
.prestart-card p{font-size:14px;color:var(--muted);line-height:1.8;margin:8px 0 16px}
.session-preview{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}
.session-preview span{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:3px 10px;border-radius:999px}
.primary{background:var(--brand);color:var(--brand-ink);font-weight:600;min-height:52px}
.secondary{box-shadow:inset 0 0 0 1px var(--line-strong)}
.full{width:100%}.start-preview{margin-top:18px}
.prestart-card .text-button{margin-top:6px}
.rest-content{padding-top:8px}
.rest-mark{width:76px;height:76px;display:flex;align-items:center;justify-content:center;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line-strong);font-size:30px;margin:22px 0}
.rest-content>p{font-size:15px;line-height:1.9;color:var(--muted);margin:12px 0 4px}
.footnote{font-size:12px;color:var(--muted);line-height:1.8;margin-top:22px}
.empty{padding:40px 8px;color:var(--muted);font-size:14px;line-height:1.9;text-align:center}
.empty .rest-mark{margin:0 auto 16px;color:var(--ink)}

/* 8 周计划 */
.week-picker{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:20px}
.week-picker button{min-width:0;min-height:60px;padding:6px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);font-family:var(--mono);font-size:17px;font-weight:600}
.week-picker small{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10px;font-weight:500;line-height:1.3}
.week-picker .deload small{color:var(--red)}
.week-picker .now:not(.selected){box-shadow:inset 0 0 0 1.5px var(--red)}
.week-picker .selected{background:var(--brand);color:var(--brand-ink);box-shadow:none}.week-picker .selected small{color:inherit;opacity:.75}
.week-block{margin-top:22px}
.week-heading{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.week-heading h2{font-size:17px}.week-heading>span{font-size:11px;color:var(--muted)}
.plan-list{display:flex;flex-direction:column;gap:8px}
.plan-row{position:relative;width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;padding:12px 16px;min-height:72px;background:var(--card);border-radius:18px;box-shadow:0 0 0 1px var(--line)}
.plan-row:active{transform:scale(.98)}
.plan-row .cal-date{font-size:11px;color:var(--muted);line-height:1.5}.plan-row .cal-date b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.plan-row .row-title{display:block;font-size:15px;font-weight:600}
.plan-row small{font-size:12px;margin-top:2px}
.plan-row.selected{box-shadow:0 0 0 1.5px var(--ink)}
.plan-row.selected .cal-date:after{content:'TODAY';display:block;font-size:9px;font-weight:700;color:var(--red)}
.rest-row{min-height:52px;background:transparent;box-shadow:none;border:1px dashed var(--line-strong)}
.rest-row .row-title{font-weight:500;color:var(--muted)}
.row-status{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.mini-hold{width:7px;height:7px;border-radius:50%;background:var(--dot-off)}
.mini-hold.done{background:var(--ink)}
.row-status .sent{font-family:var(--mono);font-size:9px;font-weight:700;color:#fff;background:var(--red);padding:2px 6px;border-radius:999px;margin-left:4px}

/* 记录 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.stat{background:var(--card);box-shadow:0 0 0 1px var(--line);border-radius:18px;padding:14px 12px 12px}
.stat b{display:block;font-size:30px;line-height:1;margin-bottom:10px}
.stat>span{font-size:12px;color:var(--muted)}
.history-actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 8px}
.history-actions button{flex:1;box-shadow:inset 0 0 0 1px var(--line-strong);font-size:14px;font-weight:600}
.history-item{background:var(--card);padding:14px 16px;border-radius:20px;margin:10px 0;box-shadow:0 0 0 1px var(--line)}
.history-item header{display:flex;justify-content:space-between;gap:12px;align-items:center}
.history-item header small{font-family:var(--mono);font-size:11px}
.history-item h3{font-size:16px}
.history-item p{font-size:13px;color:var(--muted);line-height:1.8;margin-top:8px;overflow-wrap:anywhere}
.record-summary{display:flex;flex-direction:column;gap:6px;padding-top:12px;margin-top:12px;border-top:1px dashed var(--line-strong)}
.record-line{display:flex;align-items:baseline;gap:8px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.record-line .mini-hold{flex-shrink:0;align-self:center}.record-line .mini-hold.done{background:var(--red)}
.record-line .name{flex:1;min-width:0}.record-line .muted{font-family:var(--mono);font-size:11px}

/* 底部导航 */
.bottom-nav{position:fixed;z-index:10;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:4px;width:calc(100% - 28px);max-width:420px;padding:5px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:999px;box-shadow:0 0 0 1px var(--line),0 8px 30px #0000001f}
.bottom-nav button{flex:1;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;color:var(--muted);padding:4px}
.bottom-nav button svg{width:21px;height:21px}
.bottom-nav button.active{color:var(--brand-ink);background:var(--brand);font-weight:600}

/* 休息计时：点阵时钟 */
.timer{position:fixed;z-index:12;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 72px);left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:420px;display:flex;align-items:center;gap:12px;padding:12px 10px 12px 18px;border-radius:26px;background:#000;color:#fff;box-shadow:0 0 0 1px #2a2a2a,0 10px 36px #0000004d;overflow:hidden}
.timer:before{content:'';position:absolute;left:18px;right:18px;bottom:7px;height:4px;background:radial-gradient(circle,#333 1.2px,transparent 1.5px) 0 50%/7px 4px repeat-x}
.timer:after{content:'';position:absolute;left:18px;bottom:7px;height:4px;width:calc((100% - 36px) * var(--left-ratio,1));background:radial-gradient(circle,#fff 1.4px,transparent 1.7px) 0 50%/7px 4px repeat-x;transition:width .25s linear}
.timer-ring{display:none}
.timer>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.timer small{color:#ffffffa6;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer strong{font-size:30px;line-height:1;font-weight:400}
.timer button{flex-shrink:0;min-width:58px;min-height:44px;padding:8px 14px;white-space:nowrap;color:#fff;box-shadow:inset 0 0 0 1px #444;font-size:14px;font-weight:600}
#timer-close{min-width:44px;padding:8px;font-size:20px}
.timer.finished{box-shadow:0 0 0 1.5px var(--red),0 10px 36px #0000004d}
.timer.finished strong{color:var(--red)}
.timer.finished small{color:#fff}

/* 对话框与提示 */
dialog{width:calc(100% - 24px);max-width:460px;max-height:85dvh;overflow:auto;border:0;border-radius:26px;padding:20px;background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 20px 80px #00000059}
dialog::backdrop{background:#0009;backdrop-filter:blur(4px)}
.dialog-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dialog-top h2{font-size:19px}.dialog-top button{font-size:22px;color:var(--muted)}
#dialog-target{font-size:14px;color:var(--muted);line-height:1.7;margin:6px 0 14px}
.dialog-set{display:grid;grid-template-columns:1fr 92px 52px 44px;align-items:center;gap:8px;margin:8px 0}
.dialog-set label{font-size:14px}
.dialog-set input{width:100%;padding:10px;font-size:17px;font-family:var(--mono);font-weight:600;text-align:center;background:transparent;color:var(--ink);border:1px solid var(--line-strong);border-radius:999px}
.dialog-set span{font-size:13px;color:var(--muted);min-width:52px}
.dialog-set button{padding:8px;min-width:44px;color:var(--muted)}
.error{color:var(--danger);font-size:13px;margin:10px 0;line-height:1.7}
#record-form>.muted{display:block;margin-top:12px}

function dayPlan(date){

 if(!Number.isInteger(offset)||offset<0||offset>=56)return null;

 const [title,duration,place,description]=themes[dow];

function doseFor(ex,date,logs){
 const earlier=Object.entries(logs).filter(([d])=>d<date).sort(([a],[b])=>b.localeCompare(a));
 const history=earlier.map(([d,v])=>({date:d,rec:v.items?.[ex.id]})).filter(v=>v.rec?.closed);
 let last=history[0];
 if(!last)return ex;
 if(last.rec.stopped)return {...ex,paused:true,adjustment:`${last.date.slice(5)}因不适停止，今天暂停此动作。反复不适请先评估。`};
 if(dayPlan(last.date)?.deload&&last.rec.result!=='less')last=history.find(v=>!dayPlan(v.date)?.deload)||last;
 if(last.rec.result==='less'&&last.rec.target&&last.rec.target.sets*last.rec.target.reps<ex.sets*ex.reps){
  return {...ex,sets:last.rec.target.sets,reps:last.rec.target.reps,adjustment:'上次少做，今天保持上次目标，暂不加量。'};
 }
 if(last.rec.target&&ex.sets*ex.reps>last.rec.target.sets*last.rec.target.reps){
  const previous=last.rec.target;
  const step=ex.id==='sideplank'?5:ex.id==='facepull'?2:1;
  const sets=Math.min(ex.sets,previous.sets+1);
  const reps=Math.min(ex.reps,previous.reps+(sets>previous.sets?0:step));
  if(sets<ex.sets||reps<ex.reps)return {...ex,sets,reps,adjustment:'按上次完成量逐步恢复进度，今天只增加一步。'};
 }
 return ex;
}

document.addEventListener('change',async e=>{

 if(t.dataset.session){if(!mayLog())return;let val=t.value;if(t.dataset.session!=='note'){if(val==='')val=null;else{val=Number(val);const min=t.dataset.session==='rpe'?1:0;if(!Number.isInteger(val)||val<min||val>10){toast(`请填${min}–10之间的整数`);t.value=logDay()[t.dataset.session]??'';return;}}}logDay()[t.dataset.session]=val;save();return;}
 if(t.id==='import-file'&&t.files[0]){
  try{const file=t.files[0];if(file.size>2000000)throw Error('文件过大');const input=JSON.parse(await file.text());const clean=cleanImport(input);state.logs={...state.logs,...clean.logs};save();render();toast('备份已恢复，同一天记录以备份为准。');}catch(err){toast('无法恢复：'+err.message);}
 }
});
function cleanImport(input){
 if(input?.version!==1||!input.logs||typeof input.logs!=='object'||Array.isArray(input.logs))throw Error('备份格式不正确');
 const logs={};for(const [date,l] of Object.entries(input.logs)){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!dayPlan(date)||!l||typeof l!=='object')throw Error('包含无效日期');
  const items={};for(const [id,r] of Object.entries(l.items||{})){
   if(!exercises[id]||!Array.isArray(r.values)||r.values.length>30||r.values.some(v=>v!==null&&(!Number.isInteger(v)||v<0||v>999)))throw Error('动作记录格式不正确');
   const plan=dayPlan(date).main?.find(e=>e.id===id);if(!plan)throw Error('日期与动作不匹配');
   const target=r.target;if(!target||!Number.isInteger(target.sets)||target.sets<1||target.sets>30||!Number.isInteger(target.reps)||target.reps<1||target.reps>999)throw Error('目标组次不正确');
   items[id]={values:r.values,target,unit:plan.unit,closed:r.closed===true,result:r.closed?resultFor(r.values,target):null,note:String(r.note||'').slice(0,500),stopped:r.stopped===true};
  }
  logs[date]={items,warm:Array.isArray(l.warm)?l.warm.slice(0,5).map(Boolean):[],note:String(l.note||'').slice(0,500),rpe:Number.isInteger(l.rpe)&&l.rpe>=1&&l.rpe<=10?l.rpe:null,pain:Number.isInteger(l.pain)&&l.pain>=0&&l.pain<=10?l.pain:null};
 }return {logs};
}

// Two-pose illustrations on a proportioned skeleton. Limbs keep their length while moving; hands and feet can be pinned with IK.
const LEN={torso:35,neck:13,ua:23,fa:18,th:30,sh:30};
const P=(x,y)=>[x,y];
const poses={

  a:{hip:P(149,102),t:-92,n:-88,aN:{to:P(152,26),bend:1},aF:{to:P(148,26),bend:1},lN:{a:[98,128]},lF:{a:[94,124]}},
  b:{hip:P(143,68),t:-97,n:-84,aN:{to:P(152,26),bend:1},aF:{to:P(148,26),bend:1},lN:{a:[100,130]},lF:{a:[96,126]}}},

  a:{hip:P(150,72),t:-84,n:-76,aN:{to:P(156,76),bend:1},aF:{to:P(153,76),bend:1},lN:{to:P(162,117),bend:-1},lF:{to:P(156,117),bend:-1}},
  b:{hip:P(152,86),t:-76,n:-66,aN:{to:P(156,76),bend:1},aF:{to:P(153,76),bend:1},lN:{to:P(162,117),bend:-1},lF:{to:P(156,117),bend:-1}}},

  b:{hip:P(176,136),t:180,n:192,aN:{a:[-90,-90]},aF:{a:[-172,-174]},lN:{a:[-8,-4]},lF:{a:[-88,2]}}},
 sideplank:{props:'floor',
  a:{hip:P(141,138),t:218,n:210,aN:{a:[90,180],k:[1,.35]},aF:{rel:'hip',to:P(-6,-6),bend:1},lN:{a:[4,6],k:[1,.3]},lF:{a:[1,4],k:[1,.3]}},
  b:{hip:P(145,126),t:201,n:196,aN:{a:[90,180],k:[1,.35]},aF:{rel:'hip',to:P(-6,-6),bend:1},lN:{a:[21,4],k:[1,.3]},lF:{a:[18,2],k:[1,.3]}}},
 birddog:{props:'floor',
  a:{hip:P(104,107),t:-18,n:-22,aN:{to:P(138,137),bend:1},aF:{to:P(135,137),bend:1},lN:{a:[90,180]},lF:{a:[92,181]}},
  b:{hip:P(104,107),t:-18,n:-14,aN:{a:[-6,-6]},aF:{to:P(135,137),bend:1},lN:{a:[90,180]},lF:{a:[183,182]}}},
 facepull:{props:'anchorFace',
  a:{hip:P(140,80),t:-90,n:-86,aN:{to:P(181,44),bend:-1},aF:{to:P(179,46),bend:-1},lN:{to:P(148,139),bend:1},lF:{to:P(132,139),bend:1}},

};
const polar=(p,deg,l)=>[p[0]+Math.cos(deg*Math.PI/180)*l,p[1]+Math.sin(deg*Math.PI/180)*l];
const mix=(a,b,t)=>a+(b-a)*t;
const mixAngle=(a,b,t)=>{const d=((b-a+540)%360)-180;return a+d*t;};
function mixLimb(A,B,t){const k=[mix(A.k?.[0]??1,B.k?.[0]??1,t),mix(A.k?.[1]??1,B.k?.[1]??1,t)];
 if(A.a&&B.a)return {a:[mixAngle(A.a[0],B.a[0],t),mixAngle(A.a[1],B.a[1],t)],k};
 if(A.to&&B.to)return {to:[mix(A.to[0],B.to[0],t),mix(A.to[1],B.to[1],t)],rel:A.rel,bend:A.bend,k};
 return t<.5?A:B;}
function limb(root,spec,L1,L2,base){const l1=L1*(spec.k?.[0]??1),l2=L2*(spec.k?.[1]??1);
 if(spec.a){const j1=polar(root,spec.a[0],l1);return [j1,polar(j1,spec.a[1],l2)];}
 const T=spec.rel?[base[spec.rel][0]+spec.to[0],base[spec.rel][1]+spec.to[1]]:spec.to;
 const dx=T[0]-root[0],dy=T[1]-root[1],dist=Math.hypot(dx,dy)||.001,ux=dx/dist,uy=dy/dist;
 const d=Math.min(Math.max(dist,Math.abs(l1-l2)+.01),l1+l2-.01),a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a))*(spec.bend||1);
 return [[root[0]+ux*a-uy*h,root[1]+uy*a+ux*h],[root[0]+ux*d,root[1]+uy*d]];}
function skeleton(cfg,t){const A=cfg.a,B=cfg.b,hip=[mix(A.hip[0],B.hip[0],t),mix(A.hip[1],B.hip[1],t)];
 const sh=polar(hip,mixAngle(A.t,B.t,t),LEN.torso),head=polar(sh,mixAngle(A.n,B.n,t),LEN.neck),w=cfg.front||0;
 const sN=[sh[0]-w,sh[1]],sF=[sh[0]+w,sh[1]],hN=[hip[0]-w*.6,hip[1]],hF=[hip[0]+w*.6,hip[1]],base={hip,sh};
 const g=k=>mixLimb(A[k],B[k],t);
 return {hip,sh,head,sN,sF,hN,hF,aN:limb(sN,g('aN'),LEN.ua,LEN.fa,base),aF:limb(sF,g('aF'),LEN.ua,LEN.fa,base),lN:limb(hN,g('lN'),LEN.th,LEN.sh,base),lF:limb(hF,g('lF'),LEN.th,LEN.sh,base)};}
const seg=(a,b)=>`M${a[0].toFixed(1)},${a[1].toFixed(1)} L${b[0].toFixed(1)},${b[1].toFixed(1)}`;
const chain=(r,[j1,j2])=>`${seg(r,j1)} ${seg(j1,j2)}`;
function propsSVG(kind,s){const floor='<path d="M30 141h240"/>';
 if(kind==='board')return `${floor}<rect x="118" y="8" width="64" height="11" rx="3"/><path d="M128 19h44" stroke-width="2.5"/>`;
 if(kind==='bar')return '<path d="M90 26h120" stroke-width="2.5"/>';
 if(kind==='rails')return `${floor}<path d="M104 78h108M112 78v63M204 78v63" stroke-width="2.5"/><rect x="136" y="119" width="44" height="22" rx="3"/>`;
 if(kind==='floor')return floor;
 if(kind==='anchorFace')return `${floor}<path d="M262 141V20" stroke-width="2.5"/><circle cx="262" cy="40" r="3"/><path d="M262 40 L${s.aN[1][0].toFixed(1)} ${s.aN[1][1].toFixed(1)}" stroke-dasharray="4 3"/>`;
 if(kind==='anchorSide')return `${floor}<path d="M250 141V40" stroke-width="2.5"/><circle cx="250" cy="${s.aN[0][1].toFixed(1)}" r="3"/><path d="M250 ${s.aN[0][1].toFixed(1)} L${s.aN[1][0].toFixed(1)} ${s.aN[1][1].toFixed(1)}" stroke-dasharray="4 3"/>`;
 return '';}
function poseSVG(key,t){const cfg=poses[key];if(!cfg)return '';const s=skeleton(cfg,t),far=cfg.front?1:.38;
 return `<g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" opacity=".3">${propsSVG(cfg.props,s)}</g><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path opacity="${far}" d="${chain(s.hF,s.lF)} ${chain(s.sF,s.aF)}"/><path d="${seg(s.hip,s.sh)} ${seg(s.sh,s.head)}${cfg.front?` ${seg(s.sN,s.sF)} ${seg(s.hN,s.hF)}`:''}"/><path d="${chain(s.hN,s.lN)} ${chain(s.sN,s.aN)}"/><circle cx="${s.head[0].toFixed(1)}" cy="${s.head[1].toFixed(1)}" r="8" style="fill:var(--surface,#e8e8e4)"/></g>`;}
function drawPose(stage,t=0){const svg=stage.tagName==='svg'?stage:stage.querySelector('svg');svg.innerHTML=poseSVG(stage.dataset.demo,t);}
let animations=new Map();
function drawAllDemos(){document.querySelectorAll('.demo-stage').forEach(stage=>{if(!stage.querySelector('svg').children.length)drawPose(stage);});}
function stopDemos(){animations.forEach(({raf})=>cancelAnimationFrame(raf));animations.clear();}
function toggleDemo(button){const stage=button.closest('.demo-stage'),key=stage;const running=animations.get(key);if(running){cancelAnimationFrame(running.raf);animations.delete(key);button.textContent='播放示意';button.setAttribute('aria-pressed','false');return;}button.textContent='暂停示意';button.setAttribute('aria-pressed','true');if(matchMedia('(prefers-reduced-motion: reduce)').matches){drawPose(stage,button.dataset.pose==='1'?0:1);button.dataset.pose=button.dataset.pose==='1'?'0':'1';button.textContent='切换姿势';button.setAttribute('aria-pressed','false');return;}const start=performance.now();const entry={raf:0};function tick(now){if(!document.contains(stage)||!stage.closest('details').open){animations.delete(key);button.textContent='播放示意';button.setAttribute('aria-pressed','false');return;}drawPose(stage,(1-Math.cos((now-start)/1100*Math.PI))/2);entry.raf=requestAnimationFrame(tick);}animations.set(key,entry);entry.raf=requestAnimationFrame(tick);}
