/* 岩序 · 岩馆路线风。中性白墙 + 路线胶带色，每个动作是一条线路，每组是一个岩点。 */
:root{
 color-scheme:light dark;
 --bg:#f6f7f9;--card:#fff;--surface:#eef0f3;--surface-2:#f7f8fa;--ink:#14171c;--muted:#6b7280;--line:#e6e8ec;--line-strong:#cfd3da;
 --brand:#16181d;--brand-ink:#fff;--brand-soft:#eef0f3;--accent:#16a34a;--danger:#c2410c;--danger-soft:#fdeceb;--warn-soft:#fff3e0;
 --t-orange:#ec7c1a;--t-blue:#2c78d4;--t-purple:#8657d1;--t-yellow:#d9a514;--t-pink:#dd4f89;--t-red:#dc4434;--t-green:#2a9a63;
 --shadow:0 1px 0 #00000008,0 6px 20px #2a231408;
 --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,sans-serif;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-synthesis:none
}
@media(prefers-color-scheme:dark){:root{
 --bg:#0e1014;--card:#171a20;--surface:#22262d;--surface-2:#1b1e24;--ink:#f2f3f5;--muted:#9ca3af;--line:#262a31;--line-strong:#3a3f48;
 --brand:#f2f3f5;--brand-ink:#0e1014;--brand-soft:#22262d;--accent:#4ade80;--danger:#f87171;--danger-soft:#3a1f1d;--warn-soft:#33291a;
 --t-orange:#f59544;--t-blue:#5b9cf0;--t-purple:#a283ea;--t-yellow:#ebc244;--t-pink:#ef78a8;--t-red:#f06a5a;--t-green:#4cc286;
 --shadow:0 0 0 1px #ffffff08
}}
.tape-orange{--tape:var(--t-orange)}.tape-blue{--tape:var(--t-blue)}.tape-purple{--tape:var(--t-purple)}.tape-yellow{--tape:var(--t-yellow)}.tape-pink{--tape:var(--t-pink)}.tape-red{--tape:var(--t-red)}.tape-green{--tape:var(--t-green)}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg)}
button,input,textarea,select{font:inherit}button,a,input,summary{touch-action:manipulation}
button{cursor:pointer;border:0;color:inherit;background:none;min-height:44px;padding:10px 15px;border-radius:12px;transition:background-color .15s,transform .12s,box-shadow .15s}
button:active{transform:scale(.96)}button:disabled{opacity:.4;cursor:default;transform:none}
a{color:inherit;text-underline-offset:4px}
:focus-visible{outline:3px solid var(--t-blue);outline-offset:2px}
h1,h2,h3,p{margin:0}h1,h2,h3{text-wrap:balance}p,li{text-wrap:pretty}
h1{font-size:30px;font-weight:750;letter-spacing:-.8px;line-height:1.25}h2{font-size:19px;font-weight:700;line-height:1.4}h3{font-size:16px;font-weight:650}
small,.muted{color:var(--muted);font-size:12px;line-height:1.6}small{display:block}
[hidden]{display:none!important}

/* 顶栏 */
.app-header{position:sticky;top:0;z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.header-inner{max-width:560px;margin:auto;padding:11px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:750;font-size:17px;letter-spacing:.5px}.brand img{width:30px;height:30px;border-radius:9px}.brand small{display:none}
.save-state{font-size:11px;color:var(--muted);background:var(--surface);padding:4px 9px;border-radius:99px;white-space:nowrap}
#app{max-width:560px;margin:auto;padding:18px 18px 130px}
body:has(#timer:not([hidden])) #app{padding-bottom:210px}

/* 日期栏 */
.datebar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:18px}
.datebar>div>small{display:none}.date-label{font-weight:650;font-size:14px}
.date-actions{display:flex;align-items:center;gap:2px}.date-actions button{padding:8px 11px;font-size:20px;line-height:1;color:var(--muted)}
.date-input{max-width:140px;min-height:40px;font-size:13px;border:0;background:var(--surface);color:var(--ink);padding:6px 10px;border-radius:10px}

/* 提示条 */
.notice{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:8px 12px;margin-bottom:16px;font-size:13px;line-height:1.6;border-radius:12px;background:var(--card);box-shadow:var(--shadow);color:var(--ink)}
.notice.warning{background:var(--warn-soft)}.notice a{padding:6px 0;font-weight:600;color:var(--brand)}
.text-button{font-size:13px;color:var(--brand);font-weight:600;padding:6px 4px;min-height:40px}

/* 标题区 */
.hero{position:relative;margin-bottom:20px}
.eyebrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;letter-spacing:.4px;color:var(--muted);font-weight:700;margin-bottom:8px}
.phase{font-size:11px;font-weight:650;background:var(--warn-soft);color:var(--ink);padding:2px 8px;border-radius:99px}
.hero .description{font-size:14px;line-height:1.8;color:var(--muted);margin:10px 0}
.hero-title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.hero-count{font-family:var(--num);font-size:34px;font-weight:750;letter-spacing:-1px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.hero-count small{display:inline;font-size:16px;font-weight:500;letter-spacing:0;margin-left:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.meta span{font-size:12px;color:var(--muted);background:var(--surface);padding:3px 9px;border-radius:99px}

/* 路线进度：每个动作一个岩点，连成一条线，最后是顶点 */
.progress-block{margin:18px 0 0}
.route{display:flex;align-items:center;gap:0;padding:4px 2px}
.route-hold{position:relative;z-index:1;flex-shrink:0;width:24px;height:22px;border-radius:55% 45% 60% 40%/50% 60% 40% 50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--tape,var(--line-strong));transition:background-color .25s,transform .25s}
.route-hold:nth-child(4n+3){border-radius:40% 60% 45% 55%/60% 40% 60% 40%;transform:rotate(12deg)}
.route-hold:nth-child(4n+1){border-radius:60% 40% 55% 45%/45% 55% 45% 55%;transform:rotate(-8deg)}
.route-hold.done{background:var(--tape);transform:scale(1.08)}
.route-hold.paused{box-shadow:inset 0 0 0 2px var(--line-strong);background:repeating-linear-gradient(45deg,var(--surface) 0 3px,var(--line) 3px 6px)}
.route-link{flex:1;height:3px;min-width:8px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--line-strong) 0 5px,transparent 5px 9px)}
.route-link.done{background:var(--ink)}
.route-top{flex-shrink:0;font-size:11px;font-weight:800;letter-spacing:.5px;padding:3px 7px;border-radius:6px;color:var(--muted);background:var(--surface)}
.route-top.done{color:#fff;background:var(--accent);animation:pop .5s ease}
.progress-caption{display:block;font-size:12px;color:var(--muted);margin-top:8px}
.progress-caption.done{color:var(--accent);font-weight:650}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

/* 热身 */
.warmup{background:var(--card);border-radius:16px;padding:0 16px;margin-bottom:22px;box-shadow:var(--shadow)}
.warmup>summary{min-height:64px;display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none}
.warmup summary::-webkit-details-marker{display:none}
.warm-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:var(--warn-soft);font-size:18px}
.warm-summary{flex:1}.warm-summary strong{display:block;font-size:15px;font-weight:650}.warm-summary small{font-size:12px}
.warm-count{font-family:var(--num);font-size:14px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.chevron{font-size:16px;color:var(--muted);min-width:16px;text-align:center;transition:transform .2s}
.warmup[open]>summary .chevron{transform:rotate(180deg)}
.warm-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.warm-row input{width:24px;height:24px;margin:2px 0 0;flex-shrink:0;accent-color:var(--brand)}
.warm-content{flex:1;min-width:0}.warm-content>label{display:block;min-height:44px;font-size:14px;line-height:1.6;cursor:pointer}
.warm-title{font-weight:550;overflow-wrap:anywhere}.warm-dose{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.warm-tip>summary{font-size:12px;min-height:36px;display:flex;align-items:center;color:var(--muted);cursor:pointer;list-style:none}
.warm-tip>summary:before{content:'›';display:inline-block;margin-right:6px;transition:transform .2s}.warm-tip[open]>summary:before{transform:rotate(90deg)}
.warm-tip p{font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 4px}

/* 主训练标题 */
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px;gap:10px}
.section-title h2{font-size:15px}.section-title small{font-size:12px}

/* 动作卡片 = 一条线路，左侧胶带 */
.exercise-list{display:flex;flex-direction:column;gap:10px}
.exercise{position:relative;background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:72px}
.exercise:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tape,var(--line-strong))}
.exercise.is-open{box-shadow:0 0 0 2px color-mix(in srgb,var(--tape) 45%,transparent),var(--shadow)}
.exercise.completed:not(.is-open){background:var(--surface-2)}
.ex-heading{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px 14px 20px;min-height:76px;text-align:left;border-radius:0}
.ex-heading:active{transform:none}
.order{flex-shrink:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50% 45% 55% 40%/45% 55% 45% 55%;font-family:var(--num);font-size:12px;font-weight:700;color:var(--tape);background:color-mix(in srgb,var(--tape) 15%,transparent)}
.is-open .order{background:var(--tape);color:#fff}
.completed .order{background:var(--tape);color:#fff;font-size:15px}
.ex-title{flex:1;min-width:0}
.exercise-name{display:block;font-size:15px;font-weight:650;line-height:1.45;overflow-wrap:anywhere}
.ex-title small{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:2px}
.tag{font-size:11px;font-weight:650;color:var(--tape);white-space:nowrap}
.status{font-size:12px;white-space:nowrap;color:var(--muted)}
.status.done{color:var(--accent);font-weight:600}.status.more{color:var(--t-green);font-weight:600}.status.less{color:var(--t-orange);font-weight:600}
.exercise-body{padding:0 18px 12px 22px}
.dose-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 6px}
.dose{font-family:var(--num);font-size:40px;font-weight:750;letter-spacing:-1px;line-height:1.3;white-space:nowrap;font-variant-numeric:tabular-nums}
.dose>span{font-family:-apple-system,"PingFang SC",sans-serif;font-size:14px;font-weight:500;letter-spacing:0;margin-left:3px;color:var(--muted)}
.dose em{font-size:22px;font-style:normal;font-weight:400;color:var(--muted);vertical-align:5px;margin:0 4px}
.rest-chip{font-size:12px;color:var(--muted);white-space:nowrap;background:var(--surface);border-radius:99px;padding:5px 10px}
.cue{font-size:14px;line-height:1.7;color:var(--muted);margin:4px 0 16px}
.adjustment{font-size:13px;line-height:1.7;padding:9px 12px;border-radius:10px;background:var(--warn-soft);margin:8px 0}
.increase{font-size:12px;color:var(--accent);font-weight:600;margin:6px 0}

/* 每组 = 一个岩点 */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:8px;margin:0 0 16px}
.set-btn{position:relative;min-height:58px;max-width:76px;width:100%;justify-self:center;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--surface-2);color:var(--ink);border-radius:46% 54% 42% 58%/55% 45% 55% 45%;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--tape) 55%,transparent)}
.set-btn:nth-child(3n+2){border-radius:58% 42% 55% 45%/42% 58% 42% 58%}
.set-btn:nth-child(3n){border-radius:50% 50% 40% 60%/60% 40% 60% 40%}
.set-btn>span{font-family:var(--num);font-size:19px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.set-btn small{font-size:11px;line-height:1.2}
.set-btn.checked{background:var(--tape);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--tape) 60%,#000)}
.set-btn.checked small{color:#ffffffd9}
.set-btn.checked>span{animation:pop .35s ease}

/* 操作：主按钮突出，其余次要 */
.card-actions{display:flex;flex-direction:column;gap:8px;margin:0 0 6px}
.card-actions .complete{width:100%;min-height:50px;font-size:15px;font-weight:650;color:var(--brand-ink);background:var(--brand);border-radius:14px}
.adjust-row{display:flex;gap:8px}
.adjust-row button{flex:1;min-width:0;min-height:42px;padding:8px 6px;font-size:13px;background:var(--surface);border-radius:11px}
.adjust-row .stop{color:var(--danger);background:var(--danger-soft);font-weight:600}
.actual-record{font-size:13px;line-height:1.7;background:var(--surface);border-radius:10px;margin:0 0 12px;padding:4px 12px;color:var(--ink)}
.actual-record>summary{display:flex;justify-content:space-between;align-items:center;gap:12px;list-style:none;cursor:pointer;min-height:40px;font-weight:600}
.actual-record summary span{font-size:12px;color:var(--muted);font-weight:400}
.actual-record p{padding:0 0 8px;color:var(--muted);overflow-wrap:anywhere}
.instructions{margin-top:6px;border-top:1px solid var(--line)}
.instructions>summary{display:flex;align-items:center;gap:8px;min-height:46px;font-size:14px;font-weight:600;cursor:pointer;list-style:none}
.instructions>summary span{font-size:12px;color:var(--muted);font-weight:400;margin-left:auto}
.instructions>summary:after{content:'⌄';color:var(--muted);transition:transform .2s}.instructions[open]>summary:after{transform:rotate(180deg)}
.instructions .setup{background:var(--surface);padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.7;color:var(--muted)}
.instructions ol{font-size:14px;line-height:1.8;padding-left:20px;margin:10px 0}
.instructions li{margin-bottom:6px}
.video-link{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600;color:var(--brand)}
.inline-note{font-size:12px;color:var(--muted);line-height:1.7}
.exercise-footer{display:flex;justify-content:flex-end;border-top:1px solid var(--line);margin-top:6px}
.next-action{font-size:14px;font-weight:650;color:var(--brand);padding:8px 4px;min-height:46px}

/* 动作示意 */
.demo-stage{height:190px;background:var(--surface);border-radius:12px;margin:10px 0;position:relative;overflow:hidden}
.demo-stage svg{width:100%;height:155px;color:var(--tape,var(--brand))}
.demo-control{position:absolute;bottom:6px;left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.demo-control span{font-size:11px;color:var(--muted)}
.demo-control button{font-size:12px;padding:6px 12px;min-height:44px;background:var(--card);border-radius:99px}

/* 训练感受 & 说明 */
.session-note{margin-top:18px;padding:0 16px;border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
.session-note>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;list-style:none;cursor:pointer}
.session-note summary strong{font-size:15px;font-weight:650}.session-note summary span{font-size:12px;color:var(--muted)}
.session-note[open]{padding-bottom:16px}
.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:block;color:var(--muted);font-size:13px;margin:12px 0 4px}
.field input,.field textarea,textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:11px;padding:11px 12px;color:var(--ink);background:var(--surface-2);font-size:16px}
.training-notes{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.8}
.training-notes summary{display:flex;align-items:center;gap:6px;min-height:44px;cursor:pointer;list-style:none}
.training-notes summary:after{content:'⌄'}
.training-notes p{margin:0 0 10px}

/* 开练前 / 休息日 / 周期结束 */
.welcome-date{font-family:var(--num);font-size:60px;font-weight:800;letter-spacing:-2px;line-height:1.1;margin:18px 0 6px;color:var(--ink)}
.welcome-date span{font-family:-apple-system,"PingFang SC",sans-serif;font-size:15px;font-weight:600;letter-spacing:0;margin-left:8px;color:var(--muted)}
.countdown{font-size:14px;color:var(--muted)}
.prestart-card{position:relative;margin-top:22px;padding:20px 20px 16px 24px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.prestart-card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tape,var(--brand))}
.prestart-card>small{font-size:12px;margin-bottom:4px}
.prestart-card h2{font-size:21px}
.prestart-card p{font-size:14px;color:var(--muted);line-height:1.8;margin:8px 0 16px}
.session-preview{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}
.session-preview span{font-size:12px;color:var(--muted);background:var(--surface);padding:3px 9px;border-radius:99px}
.primary{background:var(--brand);color:var(--brand-ink);font-weight:650;border-radius:14px;min-height:50px}
.secondary{background:var(--surface);color:var(--brand)}
.full{width:100%}.start-preview{margin-top:18px}
.prestart-card .text-button{margin-top:4px}
.rest-content{padding-top:8px}
.rest-mark{width:72px;height:72px;display:flex;align-items:center;justify-content:center;border-radius:46% 54% 42% 58%/55% 45% 55% 45%;background:var(--surface);color:var(--ink);font-size:32px;margin:20px 0 22px}
.rest-content>p{font-size:15px;line-height:1.9;color:var(--muted);margin:12px 0 4px}
.footnote{font-size:12px;color:var(--muted);line-height:1.8;margin-top:22px}
.empty{padding:40px 8px;color:var(--muted);font-size:14px;line-height:1.9;text-align:center}
.empty .rest-mark{margin:0 auto 16px}

/* 8 周计划 */
.week-picker{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:20px}
.week-picker button{min-width:0;min-height:60px;padding:6px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card);box-shadow:var(--shadow);border-radius:12px;font-family:var(--num);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.week-picker small{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10px;font-weight:500;line-height:1.3}
.week-picker .deload small{color:var(--t-orange)}
.week-picker .now:not(.selected){box-shadow:inset 0 0 0 2px var(--brand)}
.week-picker .selected{background:var(--brand);color:var(--brand-ink)}.week-picker .selected small{color:inherit;opacity:.8}
.week-block{margin-top:22px}
.week-heading{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.week-heading h2{font-size:17px}.week-heading>span{font-size:12px;color:var(--muted)}
.plan-list{display:flex;flex-direction:column;gap:8px}
.plan-row{position:relative;width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;padding:12px 14px 12px 18px;min-height:72px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.plan-row:before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tape,transparent)}
.plan-row:active{transform:scale(.98)}
.plan-row .cal-date{font-size:12px;color:var(--muted);line-height:1.5}.plan-row .cal-date b{display:block;font-family:var(--num);font-size:16px;color:var(--ink);font-weight:700}
.plan-row .row-title{display:block;font-size:15px;font-weight:650}
.plan-row small{font-size:12px;margin-top:2px}
.plan-row.selected{box-shadow:0 0 0 2px var(--brand)}
.plan-row.selected .cal-date:after{content:'今天';display:block;font-size:10px;font-weight:700;color:var(--brand)}
.rest-row{min-height:52px;background:transparent;box-shadow:none;border:1.5px dashed var(--line-strong)}
.rest-row .row-title{font-weight:500;color:var(--muted)}
.row-status{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.mini-hold{width:9px;height:9px;border-radius:50% 40% 55% 45%;box-shadow:inset 0 0 0 1.5px var(--tape)}
.mini-hold.done{background:var(--tape)}
.row-status .sent{font-size:11px;font-weight:700;color:#fff;background:var(--accent);padding:2px 6px;border-radius:5px;margin-left:4px}

/* 记录 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.stat{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--num);font-size:28px;font-weight:750;color:var(--ink);line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.history-actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 8px}
.history-actions button{flex:1;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;color:var(--brand)}
.history-item{position:relative;background:var(--card);padding:14px 14px 14px 20px;border-radius:16px;margin:10px 0;box-shadow:var(--shadow);overflow:hidden}
.history-item:before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tape,var(--brand))}
.history-item header{display:flex;justify-content:space-between;gap:12px;align-items:center}
.history-item h3{font-size:16px}
.history-item p{font-size:13px;color:var(--muted);line-height:1.8;margin-top:8px;overflow-wrap:anywhere}
.record-summary{display:flex;flex-direction:column;gap:6px;padding-top:10px;margin-top:10px;border-top:1px solid var(--line)}
.record-line{display:flex;align-items:baseline;gap:8px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.record-line .mini-hold{flex-shrink:0;align-self:center}
.record-line .name{flex:1;min-width:0}

/* 底部导航 */
.bottom-nav{position:fixed;z-index:10;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:4px;width:calc(100% - 28px);max-width:420px;padding:5px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:20px;box-shadow:0 0 0 1px var(--line),0 8px 30px #0000001a}
.bottom-nav button{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--muted);border-radius:15px;padding:4px}
.bottom-nav button svg{width:22px;height:22px}
.bottom-nav button.active{color:var(--brand-ink);background:var(--brand);font-weight:650}

/* 休息计时 */
.timer{position:fixed;z-index:12;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 70px);left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:420px;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:18px;background:#16181d;color:#fff;box-shadow:0 10px 36px #0000003d,0 0 0 1px #ffffff14;overflow:hidden}
.timer:before{content:'';position:absolute;left:0;bottom:0;height:3px;width:var(--left,100%);background:var(--tape,var(--t-green));transition:width .25s linear}
.timer-ring{flex-shrink:0;width:40px;height:40px;transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:4}.timer-ring .track{stroke:#ffffff26}.timer-ring .fill{stroke:var(--tape,var(--t-green));stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.timer>div{flex:1;min-width:0;display:flex;flex-direction:column}
.timer small{color:#ffffffb3;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer strong{font-family:var(--num);font-size:26px;font-weight:750;line-height:1.15;font-variant-numeric:tabular-nums}
.timer button{flex-shrink:0;min-width:56px;min-height:44px;padding:8px 12px;white-space:nowrap;color:#fff;background:#ffffff1f;font-size:14px;font-weight:600}
#timer-close{min-width:44px;padding:8px;font-size:20px}
.timer.finished{background:var(--t-green);animation:pop .45s ease}
.timer.finished small{color:#fff}

/* 对话框与提示 */
dialog{width:calc(100% - 24px);max-width:460px;max-height:85dvh;overflow:auto;border:0;border-radius:22px;padding:20px;background:var(--card);color:var(--ink);box-shadow:0 20px 80px #0000004d}
dialog::backdrop{background:#0e14117a;backdrop-filter:blur(4px)}
.dialog-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dialog-top h2{font-size:19px}.dialog-top button{font-size:22px;color:var(--muted)}
#dialog-target{font-size:14px;color:var(--muted);line-height:1.7;margin:6px 0 14px}
.dialog-set{display:grid;grid-template-columns:1fr 92px 52px 44px;align-items:center;gap:8px;margin:8px 0}
.dialog-set label{font-size:14px}
.dialog-set input{width:100%;padding:10px;font-size:17px;font-family:var(--num);font-weight:650;text-align:center;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:12px}
.dialog-set span{font-size:13px;color:var(--muted);min-width:52px}
.dialog-set button{padding:8px;min-width:44px;color:var(--muted)}
.error{color:var(--danger);font-size:13px;margin:10px 0;line-height:1.7}
#record-form>.muted{display:block;margin-top:12px}
#record-form .primary{margin-top:6px}
#toast{position:fixed;z-index:100;top:calc(env(safe-area-inset-top) + 64px);left:50%;transform:translate(-50%,-8px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:550;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 8px 24px #0003}
#toast.visible{opacity:1;transform:translate(-50%,0)}

@media(min-width:760px){#app{padding-top:28px}h1{font-size:34px}.dose{font-size:44px}}
@media(max-width:374px){#app{padding-left:14px;padding-right:14px}h1{font-size:26px}.hero-count{font-size:28px}.dose{font-size:34px}.ex-heading{padding-left:17px;padding-right:12px;gap:10px}.exercise-body{padding:0 14px 12px 18px}.sets{gap:6px}.date-input{max-width:128px}.stat b{font-size:24px}}
@media(max-width:430px){.week-picker{grid-template-columns:repeat(4,1fr);gap:8px}.week-picker button{min-height:52px;flex-direction:row;gap:4px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

function dayPlan(date){
 const offset=dayNumber(date)-dayNumber(START);
 if(!Number.isInteger(offset)||offset<0||offset>=56)return null;
 const week=Math.floor(offset/7)+1,dow=offset%7;
 if(!themes[dow])return {date,week,dow,rest:true,title:dow===0?'恢复与准备':dow===2?'休息，让训练沉淀':'攀岩后的恢复',focus:weekNames[week-1],description:'今天没有力量或悬挂任务。正常活动，给手指、前臂和肩膀恢复时间。'};
 const [title,duration,place,description]=themes[dow];
 const ids=dow===1?['hang','dip','pull','deadbug','external']:dow===3?['footwork','dynamic','easy']:dow===4?['sideplank','facepull','birddog']:['dynamic','project','sloper','footwork'];
 const main=ids.map(id=>{let [sets,reps]=profiles[id][week-1];if(dow===5&&id==='dynamic')sets=[4,4,5,3,4,5,5,3][week-1];if(dow===5&&id==='footwork')sets=[4,4,5,3,4,5,5,3][week-1];return {id,...exercises[id],sets,reps};});
 const warmup=dow===1?warmStrength:dow===4?[
 ['身体活动','原地走动、肩绕环','2分钟＋肩绕环10次','轻松活动，不追求出汗。'],
 ['轻量准备','墙面肩胛俯卧撑','1组×8次','手肘伸直，轻轻推开墙面再回位。']
 ]:warmClimb;
 return {date,week,dow,title,duration,place,description,focus:weekNames[week-1],main,warmup,rest:false,deload:week===4||week===8};
}
function doseFor(ex,date,logs){
 const earlier=Object.entries(logs).filter(([d])=>d<date).sort(([a],[b])=>b.localeCompare(a));
 const history=earlier.map(([d,v])=>({date:d,rec:v.items?.[ex.id]})).filter(v=>v.rec?.closed);
 let last=history[0];
 if(!last)return ex;
 if(last.rec.stopped)return {...ex,paused:true,adjustment:`${last.date.slice(5)}因不适停止，今天暂停此动作。反复不适请先评估。`};
 if(dayPlan(last.date)?.deload&&last.rec.result!=='less')last=history.find(v=>!dayPlan(v.date)?.deload)||last;
 if(last.rec.result==='less'&&last.rec.target&&last.rec.target.sets*last.rec.target.reps<ex.sets*ex.reps){
  return {...ex,sets:last.rec.target.sets,reps:last.rec.target.reps,adjustment:'上次少做，今天保持上次目标，暂不加量。'};
 }
 if(last.rec.target&&ex.sets*ex.reps>last.rec.target.sets*last.rec.target.reps){
  const previous=last.rec.target;
  const step=ex.id==='sideplank'?5:ex.id==='facepull'?2:1;
  const sets=Math.min(ex.sets,previous.sets+1);
  const reps=Math.min(ex.reps,previous.reps+(sets>previous.sets?0:step));
  if(sets<ex.sets||reps<ex.reps)return {...ex,sets,reps,adjustment:'按上次完成量逐步恢复进度，今天只增加一步。'};
 }
 return ex;
}

 if(t.dataset.focus||t.dataset.next){const id=t.dataset.focus||t.dataset.next;activeExercise=t.dataset.focus&&activeExercise===id?'':id;stopDemos();document.querySelectorAll('[data-ex]').forEach(card=>{const open=card.dataset.ex===activeExercise,ex=currentExercises.find(x=>x.id===card.dataset.ex),record=state.logs[selected]?.items?.[card.dataset.ex];card.classList.toggle('is-open',open);card.querySelector('.exercise-body').hidden=!open;card.querySelector('[data-focus]').setAttribute('aria-expanded',String(open));card.querySelector('.chevron').textContent=open?'−':'＋';card.querySelector('.status').textContent=ex?.paused?'暂停':record?.closed?resultNames[record.result]:open?'进行中':'待练';});drawAllDemos();if(t.dataset.next)document.querySelector(`[data-ex="${id}"]`)?.scrollIntoView({block:'start',behavior:'instant'});return;}
 if(t.hasAttribute('data-finish-session')){const note=$('#session-note');if(note){note.open=true;note.scrollIntoView({block:'center',behavior:'instant'});note.querySelector('input')?.focus({preventScroll:true});}return;}
 if(t.dataset.switch){tab=t.dataset.switch;render();window.scrollTo(0,0);return;}
 if(t.dataset.goto){goto(t.dataset.goto);return;}
 if(t.dataset.day){goto(addDays(selected,Number(t.dataset.day)));return;}
 if(t.hasAttribute('data-demo-link')){const url=new URL(location.href);url.searchParams.set('demo','1');location.href=url.href;return;}
 if(t.hasAttribute('data-set')){
  if(!mayLog())return;const ex=currentExercises.find(x=>x.id===t.dataset.id);if(!ex||ex.paused)return;const log=setLog(ex),i=Number(t.dataset.set),was=log.values[i]!=null;log.values[i]=was?null:ex.reps;log.closed=Array.from({length:ex.sets},(_,n)=>log.values[n]!=null).every(Boolean);log.result=log.closed?resultFor(log.values,ex):null;log.stopped=false;save();rerenderCard(ex.id);if(!was&&!log.closed)startTimer(ex);return;
 }
 if(t.dataset.action){
  if(!mayLog())return;const ex=currentExercises.find(x=>x.id===t.dataset.id);if(!ex||ex.paused)return;
  if(t.dataset.action==='more'||t.dataset.action==='less'){showDialog(ex,t.dataset.action);return;}
  const log=setLog(ex);
  if(t.dataset.action==='done'){Object.assign(log,{values:Array(ex.sets).fill(ex.reps),closed:true,result:'done',stopped:false});save();rerenderCard(ex.id);toast('已按计划记录完成');return;}
  if(t.dataset.action==='stop'){
   log.values=log.values.map(v=>v??0);Object.assign(log,{closed:true,result:resultFor(log.values,ex),stopped:true,note:'因不适停止。'+(log.note||'')});ex.paused=true;ex.adjustment='本次因不适停止，今天不再继续此动作。后续也会暂停，待恢复安排明确后再调整。';save();rerenderCard(ex.id);toast('已记录停止，后续暂停此动作。');return;
  }
 }
 if(t.id==='export-data'){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`岩序训练备份_${today()}${demo?'_体验':''}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('备份已导出');}
 if(t.id==='import-data')$('#import-file').click();
 if(t.dataset.play)toggleDemo(t);
});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.id==='date-picker'&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){goto(t.value);return;}
 if(t.hasAttribute('data-warm')){if(!mayLog())return;logDay().warm??=[];logDay().warm[Number(t.dataset.warm)]=t.checked;save();const warm=$('.warmup summary .warm-count');if(warm)warm.textContent=`${logDay().warm.filter(Boolean).length}/${currentPlan().warmup.length}`;return;}
 if(t.dataset.session){if(!mayLog())return;let val=t.value;if(t.dataset.session!=='note'){if(val==='')val=null;else{val=Number(val);const min=t.dataset.session==='rpe'?1:0;if(!Number.isInteger(val)||val<min||val>10){toast(`请填${min}–10之间的整数`);t.value=logDay()[t.dataset.session]??'';return;}}}logDay()[t.dataset.session]=val;save();return;}
 if(t.id==='import-file'&&t.files[0]){
  try{const file=t.files[0];if(file.size>2000000)throw Error('文件过大');const input=JSON.parse(await file.text());const clean=cleanImport(input);state.logs={...state.logs,...clean.logs};save();render();toast('备份已恢复，同一天记录以备份为准。');}catch(err){toast('无法恢复：'+err.message);}
 }
});
function cleanImport(input){
 if(input?.version!==1||!input.logs||typeof input.logs!=='object'||Array.isArray(input.logs))throw Error('备份格式不正确');
 const logs={};for(const [date,l] of Object.entries(input.logs)){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!dayPlan(date)||!l||typeof l!=='object')throw Error('包含无效日期');
  const items={};for(const [id,r] of Object.entries(l.items||{})){
   if(!exercises[id]||!Array.isArray(r.values)||r.values.length>30||r.values.some(v=>v!==null&&(!Number.isInteger(v)||v<0||v>999)))throw Error('动作记录格式不正确');
   const plan=dayPlan(date).main?.find(e=>e.id===id);if(!plan)throw Error('日期与动作不匹配');
   const target=r.target;if(!target||!Number.isInteger(target.sets)||target.sets<1||target.sets>30||!Number.isInteger(target.reps)||target.reps<1||target.reps>999)throw Error('目标组次不正确');
   items[id]={values:r.values,target,unit:plan.unit,closed:r.closed===true,result:r.closed?resultFor(r.values,target):null,note:String(r.note||'').slice(0,500),stopped:r.stopped===true};
  }
  logs[date]={items,warm:Array.isArray(l.warm)?l.warm.slice(0,5).map(Boolean):[],note:String(l.note||'').slice(0,500),rpe:Number.isInteger(l.rpe)&&l.rpe>=1&&l.rpe<=10?l.rpe:null,pain:Number.isInteger(l.pain)&&l.pain>=0&&l.pain<=10?l.pain:null};
 }return {logs};
}

let animations=new Map();
function drawPose(stage,t=0){const cfg=poses[stage.dataset.demo];if(!cfg)return;const p=cfg.a.map((xy,i)=>xy.map((v,j)=>v+(cfg.b[i][j]-v)*t)),line=(a,b,opacity=1)=>`<path d="M${p[a][0]},${p[a][1]} L${p[b][0]},${p[b][1]}" opacity="${opacity}"/>`;stage.querySelector('svg').innerHTML=`<g stroke="currentColor" stroke-linecap="round" stroke-width="1.5" opacity=".25">${cfg.bar?'<path d="M83 25h134"/>':''}${cfg.rails?'<path d="M105 95h30M165 95h30M117 95v48M183 95v48"/>':''}${cfg.floor?'<path d="M35 141h230"/>':''}${cfg.band?`<path d="M150 15 L${p[3][0]} ${p[3][1]} M150 15 L${p[5][0]} ${p[5][1]}"/>`:''}${cfg.external?`<path d="M70 82 L${p[3][0]} ${p[3][1]} M230 82 L${p[5][0]} ${p[5][1]}"/>`:''}</g><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="${p[0][0]}" cy="${p[0][1]}" r="9" fill="#eef2e7"/>${line(0,1)}${line(1,6)}${line(1,2)}${line(2,3)}${line(1,4,.6)}${line(4,5,.6)}${line(6,7)}${line(7,8)}${line(6,9,.6)}${line(9,10,.6)}</g>`;}
function drawAllDemos(){document.querySelectorAll('.demo-stage').forEach(stage=>{if(!stage.querySelector('svg').children.length)drawPose(stage);});}
function stopDemos(){animations.forEach(({raf})=>cancelAnimationFrame(raf));animations.clear();}
function toggleDemo(button){const stage=button.closest('.demo-stage'),key=stage;const running=animations.get(key);if(running){cancelAnimationFrame(running.raf);animations.delete(key);button.textContent='播放示意';button.setAttribute('aria-pressed','false');return;}button.textContent='暂停示意';button.setAttribute('aria-pressed','true');if(matchMedia('(prefers-reduced-motion: reduce)').matches){drawPose(stage,button.dataset.pose==='1'?0:1);button.dataset.pose=button.dataset.pose==='1'?'0':'1';button.textContent='切换姿势';button.setAttribute('aria-pressed','false');return;}const start=performance.now();const entry={raf:0};function tick(now){if(!document.contains(stage)||!stage.closest('details').open){animations.delete(key);button.textContent='播放示意';button.setAttribute('aria-pressed','false');return;}drawPose(stage,(1-Math.cos((now-start)/1100*Math.PI))/2);entry.raf=requestAnimationFrame(tick);}animations.set(key,entry);entry.raf=requestAnimationFrame(tick);}
